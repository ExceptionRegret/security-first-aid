name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        run: npm run release:validate -- "${{ steps.version.outputs.version }}"

      - name: Run release verification
        run: npm run release:check

      - name: Build release artifact
        id: artifact
        shell: bash
        run: |
          npm pack
          TARFILE="$(ls security-first-aid-*.tgz)"
          sha256sum "$TARFILE" > "$TARFILE.sha256"
          echo "tarball=$TARFILE" >> "$GITHUB_OUTPUT"
          echo "checksum=$TARFILE.sha256" >> "$GITHUB_OUTPUT"

      - name: Extract changelog-backed release notes
        run: node scripts/extract-release-notes.mjs "${{ steps.version.outputs.version }}" --output "$RUNNER_TEMP/release-notes.md"

      - name: Publish package to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ steps.artifact.outputs.tarball }}
            ${{ steps.artifact.outputs.checksum }}
